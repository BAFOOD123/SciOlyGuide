<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="sans-serif" font-size="13">
  <rect width="520" height="300" fill="#f8fafc"/>
  <!-- Track rails -->
  <rect x="20" y="238" width="480" height="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="20" y="210" width="12" height="44" fill="#cbd5e1" stroke="#94a3b8"/><rect x="488" y="210" width="12" height="44" fill="#cbd5e1" stroke="#94a3b8"/>
  <text x="212" y="276" fill="#64748b" font-size="11">track (45 cm wide)</text>
  <!-- Air cushion gap -->
  <g stroke="#38bdf8" stroke-width="2"><line x1="120" y1="232" x2="120" y2="222"/><line x1="170" y1="232" x2="170" y2="222"/><line x1="220" y1="232" x2="220" y2="222"/><line x1="300" y1="232" x2="300" y2="222"/><line x1="350" y1="232" x2="350" y2="222"/><line x1="400" y1="232" x2="400" y2="222"/></g>
  <text x="300" y="222" fill="#0284c7" font-size="11">air cushion</text>
  <!-- Hull / plenum -->
  <path d="M110 150 h300 a14 14 0 0 1 14 14 v40 a10 10 0 0 1 -10 10 h-308 a10 10 0 0 1 -10 -10 v-40 a14 14 0 0 1 14 -14 Z" fill="#fde68a" stroke="#b45309" stroke-width="2.4"/>
  <text x="228" y="196" fill="#92400e">plenum (air chamber)</text>
  <!-- Skirt -->
  <path d="M112 214 q8 16 -2 20 M408 214 q-8 16 2 20" fill="none" stroke="#6b7280" stroke-width="3"/>
  <text x="360" y="214" fill="#6b7280" font-size="11">skirt</text>
  <!-- Lift fan (down into plenum) -->
  <g transform="translate(170,150)"><circle r="20" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><path d="M-14 0 h28 M0 -14 v28" stroke="#1d4ed8" stroke-width="3"/></g>
  <text x="140" y="124" fill="#1d4ed8" font-size="11">lift fan ↓</text>
  <path d="M170 172 v30" stroke="#38bdf8" stroke-width="2" marker-end="url(#d)"/>
  <!-- Thrust fan (pushes air back) -->
  <g transform="translate(360,150)"><circle r="18" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/><path d="M-12 0 h24 M0 -12 v24" stroke="#15803d" stroke-width="3"/></g>
  <text x="330" y="124" fill="#15803d" font-size="11">thrust fan</text>
  <path d="M378 150 h40" stroke="#15803d" stroke-width="3" marker-end="url(#d2)"/>
  <text x="392" y="144" fill="#15803d" font-size="11">→ thrust</text>
  <!-- Nickels payload -->
  <g transform="translate(250,138)"><ellipse cx="0" cy="0" rx="26" ry="8" fill="#d6d3d1" stroke="#78716c" stroke-width="1.5"/><ellipse cx="0" cy="-6" rx="26" ry="8" fill="#e7e5e4" stroke="#78716c" stroke-width="1.5"/></g>
  <text x="222" y="120" fill="#78716c" font-size="11">nickel load</text>
  <!-- Dowel -->
  <rect x="104" y="96" width="6" height="56" fill="#a16207"/><text x="60" y="110" fill="#a16207" font-size="11">timing dowel</text>
  <defs>
    <marker id="d" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto"><path d="M0 0 L4 7 L8 0 Z" fill="#38bdf8"/></marker>
    <marker id="d2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#15803d"/></marker>
  </defs>
</svg>
