<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="sans-serif" font-size="13">
  <rect width="760" height="240" fill="#f8fafc"/>
  <!-- Track lane -->
  <rect x="40" y="70" width="680" height="96" fill="#eef2f6" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="40" y1="118" x2="720" y2="118" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/>
  <!-- Start point -->
  <rect x="86" y="108" width="10" height="20" fill="#334155"/>
  <text x="78" y="150" fill="#334155">Start</text>
  <!-- Vehicle -->
  <g transform="translate(96,100)">
    <rect x="0" y="0" width="70" height="36" rx="5" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/>
    <circle cx="14" cy="38" r="7" fill="#1e293b"/><circle cx="56" cy="38" r="7" fill="#1e293b"/>
    <path d="M70 6 l14 12 l-14 12 Z" fill="#a5b4fc" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="24" y="22" fill="#3730a3" font-size="11">EV</text>
  </g>
  <text x="150" y="150" fill="#4f46e5" font-size="11">bottle pusher →</text>
  <!-- Target point -->
  <rect x="470" y="108" width="10" height="20" fill="#0f766e"/>
  <text x="452" y="150" fill="#0f766e">Target</text>
  <path d="M96 190 h384" stroke="#64748b" stroke-width="1"/>
  <text x="250" y="206" fill="#64748b">Target Distance (5–9 m)</text>
  <path d="M96 190 l8 -4 v8 Z" fill="#64748b"/><path d="M480 190 l-8 -4 v8 Z" fill="#64748b"/>
  <!-- Bottle line -->
  <line x1="610" y1="72" x2="610" y2="164" stroke="#b45309" stroke-width="4"/>
  <text x="588" y="62" fill="#b45309">Bottle Line</text>
  <!-- Water bottle (sits beyond target, pushed toward line) -->
  <g transform="translate(560,100)">
    <rect x="0" y="0" width="18" height="40" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
    <rect x="5" y="-7" width="8" height="8" fill="#0284c7"/>
  </g>
  <text x="540" y="156" fill="#0284c7" font-size="11">water bottle</text>
  <path d="M580 120 q22 0 28 0" stroke="#0284c7" stroke-width="1.5" marker-end="url(#a)" fill="none"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#0284c7"/></marker></defs>
  <path d="M480 214 h130" stroke="#64748b" stroke-width="1"/>
  <text x="498" y="230" fill="#64748b" font-size="11">Bottle Line dist. (1–3 m)</text>
  <!-- Reverse arrow: vehicle returns to stop at target -->
  <path d="M300 86 q-40 -24 -120 0" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a2)"/>
  <defs><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#4f46e5"/></marker></defs>
  <text x="196" y="74" fill="#4f46e5" font-size="11">then reverse to stop on target</text>
</svg>
