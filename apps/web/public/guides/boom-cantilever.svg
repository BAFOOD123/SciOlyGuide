<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="sans-serif" font-size="13">
  <rect width="480" height="320" fill="#f8fafc"/>
  <!-- Testing wall -->
  <rect x="40" y="30" width="26" height="230" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <text x="34" y="280" fill="#64748b" font-size="11">testing wall</text>
  <!-- Mounting bolt -->
  <circle cx="66" cy="70" r="7" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
  <text x="76" y="60" fill="#334155" font-size="10">mounting bolt</text>
  <!-- Tension chord (top) -->
  <line x1="66" y1="70" x2="400" y2="70" stroke="#dc2626" stroke-width="5"/>
  <text x="200" y="60" fill="#b91c1c" font-weight="bold">tension (chord)</text>
  <!-- Compression member (from lower wall to tip) -->
  <line x1="66" y1="210" x2="400" y2="74" stroke="#2563eb" stroke-width="6"/>
  <text x="150" y="170" fill="#1d4ed8" font-weight="bold" transform="rotate(-18 150 170)">compression</text>
  <!-- Wall contact point -->
  <circle cx="66" cy="210" r="5" fill="#1e293b"/>
  <text x="76" y="226" fill="#334155" font-size="10">wall contact (above the 10 cm line)</text>
  <!-- Bracing (lattice) -->
  <g stroke="#60a5fa" stroke-width="2">
    <line x1="150" y1="70" x2="150" y2="131"/><line x1="234" y1="70" x2="234" y2="103"/><line x1="318" y1="70" x2="318" y2="88"/>
    <line x1="108" y1="194" x2="192" y2="70"/><line x1="192" y1="117" x2="276" y2="70"/><line x1="276" y1="96" x2="360" y2="70"/>
  </g>
  <!-- Load at the tip -->
  <g transform="translate(400,74)">
    <rect x="-10" y="0" width="20" height="14" fill="#a16207" stroke="#78350f" stroke-width="1.5"/>
    <line x1="0" y1="14" x2="0" y2="46" stroke="#334155" stroke-width="2"/>
    <path d="M-16 46 h32 l-6 36 h-20 Z" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
    <text x="-5" y="70" font-size="11" fill="#374151">▼</text>
  </g>
  <text x="372" y="140" fill="#374151" font-size="10">loading block</text>
  <text x="352" y="200" fill="#374151" font-size="11">load (sand, up to 15 kg)</text>
  <!-- Distance -->
  <path d="M66 300 h334" stroke="#64748b" stroke-width="1"/>
  <path d="M66 300 l8 -4 v8 Z" fill="#64748b"/><path d="M400 300 l-8 -4 v8 Z" fill="#64748b"/>
  <text x="180" y="316" fill="#64748b" font-size="11">40–45 cm from the wall</text>
</svg>
