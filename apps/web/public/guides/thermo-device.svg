<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 320" font-family="sans-serif" font-size="13">
  <rect width="460" height="320" fill="#f8fafc"/>
  <!-- Heat lamp -->
  <g transform="translate(230,30)">
    <path d="M-34 0 h68 l-14 20 h-40 Z" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
    <circle cx="0" cy="22" r="10" fill="#fde047" stroke="#ca8a04" stroke-width="2"/>
    <text x="42" y="14" fill="#4b5563" font-size="11">heat lamp (100–125 W)</text>
  </g>
  <!-- Light rays -->
  <g stroke="#fbbf24" stroke-width="2"><line x1="214" y1="58" x2="190" y2="120"/><line x1="230" y1="60" x2="230" y2="120"/><line x1="246" y1="58" x2="270" y2="120"/></g>
  <!-- Reflective funnel collar -->
  <path d="M150 128 l40 40 h80 l40 -40 Z" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="300" y="130" fill="#2563eb" font-size="11">reflective funnel</text>
  <!-- Insulated box -->
  <rect x="150" y="166" width="160" height="128" rx="6" fill="#fed7aa" stroke="#c2410c" stroke-width="2.5"/>
  <rect x="166" y="182" width="128" height="96" fill="#1f2937"/>
  <text x="314" y="210" fill="#c2410c" font-size="11">insulation</text>
  <text x="314" y="226" fill="#111827" font-size="11">black absorber</text>
  <!-- Clear lid over cup -->
  <line x1="196" y1="196" x2="268" y2="196" stroke="#93c5fd" stroke-width="3"/>
  <text x="200" y="192" fill="#2563eb" font-size="10">clear lid</text>
  <!-- Cup of water -->
  <g transform="translate(232,236)">
    <path d="M-22 -30 l44 0 l-5 44 l-34 0 Z" fill="#bae6fd" fill-opacity="0.85" stroke="#0369a1" stroke-width="2"/>
    <text x="-16" y="4" fill="#075985" font-size="10">100 mL</text>
  </g>
  <text x="252" y="252" fill="#0369a1" font-size="11">water cup</text>
  <!-- Cube dimension -->
  <path d="M136 166 v128" stroke="#64748b" stroke-width="1"/><text x="96" y="236" fill="#64748b" font-size="11" transform="rotate(-90 110 236)">≤ 30 cm</text>
</svg>
