<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" font-family="sans-serif" font-size="13">
  <rect width="420" height="340" fill="#f8fafc"/>
  <text x="210" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">The epidemiologic triad</text>
  <!-- Triangle -->
  <polygon points="210,60 360,290 60,290" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Agent (top) -->
  <circle cx="210" cy="60" r="34" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="210" y="56" text-anchor="middle" font-weight="bold" fill="#b91c1c">Agent</text>
  <text x="210" y="72" text-anchor="middle" font-size="10" fill="#b91c1c">the cause</text>
  <!-- Host (bottom left) -->
  <circle cx="60" cy="290" r="34" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="60" y="286" text-anchor="middle" font-weight="bold" fill="#1d4ed8">Host</text>
  <text x="60" y="302" text-anchor="middle" font-size="10" fill="#1d4ed8">the person</text>
  <!-- Environment (bottom right) -->
  <circle cx="360" cy="290" r="36" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="360" y="286" text-anchor="middle" font-weight="bold" fill="#15803d">Environ-</text>
  <text x="360" y="300" text-anchor="middle" font-weight="bold" fill="#15803d">ment</text>
  <!-- Time in the middle -->
  <circle cx="210" cy="213" r="26" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="210" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#a16207">Time</text>
  <text x="210" y="224" text-anchor="middle" font-size="9" fill="#a16207">+ vector</text>
  <!-- small descriptors -->
  <text x="130" y="150" font-size="10" fill="#64748b">infectivity,</text>
  <text x="130" y="163" font-size="10" fill="#64748b">dose</text>
  <text x="258" y="150" font-size="10" fill="#64748b">immunity,</text>
  <text x="258" y="163" font-size="10" fill="#64748b">behavior</text>
  <text x="150" y="312" font-size="10" fill="#64748b">physical · biological · social factors</text>
</svg>
